[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = '=[lovely debugplus.core "debugplus/core.lua"]'
pattern = '''
local new_card = copy_card(_card, nil, nil, _card.playing_card)
'''
position = "at"
payload = '''
G.yorick_dont_reset_qty = true
local new_card = copy_card(_card, nil, nil, _card.playing_card)
G.yorick_dont_reset_qty = nil
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
-- TARGET: calc_dollar_bonus per card
if ret then
    i = i+1
    add_round_eval_row({dollars = ret, bonus = true, name='joker'..i, pitch = pitch, card = _card})
    pitch = pitch + 0.06
    dollars = dollars + ret
end
'''
position = "after"
payload = '''
if ret and (_card and _card.ability and _card.ability.immutable and _card.ability.immutable.yorick_amount) and to_big(_card.ability.immutable.yorick_amount) > to_big(1) then
    for i = 1, _card.ability.immutable.yorick_amount do
        i = i+1
        add_round_eval_row({dollars = ret, bonus = true, name='joker'..i, pitch = pitch, card = _card})
        pitch = pitch + 0.06
        dollars = dollars + ret
    end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/utils.lua"]'''
pattern = '''
if key == 'extra' then
    return SMODS.calculate_effect(amount, scored_card)
end
'''
position = "at"
payload = '''
if key == 'extra' then
    return SMODS.calculate_effect(amount, scored_card, from_edition)
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
G.E_MANAGER:add_event(Event({
    func = function()
        context.other_joker:juice_up(0.5, 0.5)
        return true
    end
})) 
'''
position = "at"
payload = '''
-- Removed by Yorick
'''
match_indent = true